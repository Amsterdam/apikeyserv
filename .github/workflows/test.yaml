name: Build and test
permissions:
  contents: read
  pull-requests: write

env:
  COVERAGE_PYTHON_VERSION: "3.14"

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    services:
      db:
        image: postgres:14
        env:
          POSTGRES_DB: apikeyserv
          POSTGRES_USER: apikeyserv
          POSTGRES_PASSWORD: insecure
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install server dependencies
      working-directory: server
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements_dev.txt
    - name: Test Server with coverage
      if: matrix.python-version == env.COVERAGE_PYTHON_VERSION
      working-directory: server
      run: |
        pytest
      env:
        COVERAGE_FILE: ${{ github.workspace }}/.coverage.server
        DATABASE_HOST: localhost
    - name: Test Server
      if: matrix.python-version != env.COVERAGE_PYTHON_VERSION
      working-directory: server
      run: |
        pytest --override-ini="addopts="
      env:
        DATABASE_HOST: localhost
    - name: Install client dependencies
      working-directory: apikeyclient
      run: |
        python -m pip install --upgrade pip
        python -m pip install .[test]
    - name: Test Middleware with coverage
      if: matrix.python-version == env.COVERAGE_PYTHON_VERSION
      working-directory: apikeyclient
      run: |
        pytest
      env:
        COVERAGE_FILE: ${{ github.workspace }}/.coverage.apikeyclient
        DATABASE_HOST: localhost
    - name: Test Middleware
      if: matrix.python-version != env.COVERAGE_PYTHON_VERSION
      working-directory: apikeyclient
      run: |
        pytest --override-ini="addopts="
      env:
        DATABASE_HOST: localhost
    - name: Combine coverage reports
      if: matrix.python-version == env.COVERAGE_PYTHON_VERSION
      run: |
        python -m coverage combine --keep .
        python -m coverage report --fail-under=89
        python -m coverage xml -o coverage-aggregate.xml
    - name: Upload coverage artifacts
      if: matrix.python-version == env.COVERAGE_PYTHON_VERSION
      uses: actions/upload-artifact@v4
      with:
        name: coverage-${{ matrix.python-version }}
        path: |
          .coverage
          .coverage.*
          coverage-aggregate.xml
          server/coverage-server.xml
          apikeyclient/coverage-apikeyclient.xml
